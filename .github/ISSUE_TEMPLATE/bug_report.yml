name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through [private reporting](https://github.com/TgkCapture/mock-box/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the request you sent (curl is ideal) and the response you got.
      placeholder: |
        curl -i "http://127.0.0.1:5000/api/users?count=2"
        HTTP/1.1 500 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mock-Box version
      description: Run `mockbox --version`, or check `GET /health`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker
        - pip
        - From source
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant settings, `--features`, or the custom routes file. Remove any secrets.
      render: ini
