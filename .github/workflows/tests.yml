name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,server,yaml]"
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mock-box:ci .
      - name: Smoke test
        run: |
          docker run -d --name mockbox -p 5000:5000 mock-box:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5000/health && break; sleep 1; done
          curl -fsS "http://127.0.0.1:5000/api/users?count=2&seed=ci"
          docker logs mockbox
      - name: Smoke test feature switches
        run: |
          docker run -d --name mockbox-payments -p 5001:5000 -e MOCKBOX_FEATURES=payments mock-box:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5001/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5001/api/payments
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/api/users)" = "404"
